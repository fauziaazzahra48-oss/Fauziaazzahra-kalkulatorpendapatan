<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Calc</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="card">
    <h2>Kalkulator 💰</h2>
    <p class="desc">Analisis rata-rata pendapatan Anda</p>

    <form method="POST">
        <div class="input-group">
            <label>Total Pendapatan</label>
            <input type="number" name="total_pendapatan" placeholder="Contoh: 50000000" required>
        </div>
        
        <div class="input-group">
            <label>Periode (Bulan)</label>
            <input type="number" name="jumlah_bulan" placeholder="Masukan angka bulan" required>
        </div>

        <button type="submit">Hitung Sekarang</button>
    </form>

    {% if hasil %}
    <div class="result-container">
        <span class="result-label">Rata-Rata Bulanan</span>
        <span class="result-value">{{ hasil }}</span>
    </div>
    {% endif %}
</div>

</body>
</html>
